name: Build Chrome Extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate manifest & syntax
        run: npm run lint

      - name: Read version from manifest.json
        id: meta
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build extension zip
        run: npm run build

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearfeed-youtube-members-hider-zip
          path: dist/clearfeed-youtube-members-hider-v*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          ZIP="dist/clearfeed-youtube-members-hider-${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "ClearFeed ${TAG}" --latest
          else
            gh release create "$TAG" "$ZIP" \
              --title "ClearFeed ${TAG}" \
              --generate-notes \
              --latest \
              --target "${GITHUB_SHA}"
          fi
