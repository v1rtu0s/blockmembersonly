name: Build Chrome Extension

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate manifest & syntax
        run: npm run lint

      - name: Build extension zip
        run: npm run build

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: clearfeed-youtube-members-hider-zip
          path: dist/clearfeed-youtube-members-hider-v*.zip
          if-no-files-found: error

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/clearfeed-youtube-members-hider-v*.zip
          generate_release_notes: true
